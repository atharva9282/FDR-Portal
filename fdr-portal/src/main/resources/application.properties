spring.application.name=fdr-portal
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/fdr_portal
spring.datasource.username=fdr_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Document upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Private document storage outside the frontend's public directory
app.storage.upload-dir=./var/fdr-documents

# Alert thresholds, in days before maturity
app.monitoring.reminder-days=30,15,7,1

# Dashboard's expiring-soon classification
app.monitoring.expiring-soon-days=30

# Local development: run the scan every minute
app.monitoring.cron=0 */1 * * * *

# JWT authentication
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl-minutes=120

# Initial administrator account
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}