spring.application.name=fdr-portal
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/fdr_portal
spring.datasource.username=fdr_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Apply versioned fixes to existing PostgreSQL databases before Hibernate starts.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Document upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Private document storage outside the frontend's public directory
app.storage.upload-dir=./var/fdr-documents

# Alert thresholds, in days before maturity
app.monitoring.reminder-days=30,15,7,1

# Dashboard's expiring-soon classification
app.monitoring.expiring-soon-days=30

# Run the maturity scan daily at 8 AM IST by default.
# Override MATURITY_ALERT_CRON for local testing when needed.
app.monitoring.cron=${MATURITY_ALERT_CRON:0 0 8 * * *}

# Comma-separated, explicit browser origins. Keep wildcards out of production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT authentication
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl-minutes=120

# Initial administrator account
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}